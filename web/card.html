<article class="software-card" data-search="$name $platform $category $version">
  <div class="card-top"><span class="app-icon" aria-hidden="true">↓</span><span class="category">$category</span></div>
  <h2>$name <span class="version">$version</span></h2>
  <p class="description">$description</p>
  <div class="metadata"><span>$platform</span><span>$size</span><span>$extension</span></div>
  <a class="button primary" href="$url">下载安装包 <span aria-hidden="true">↗</span></a>
  <div class="card-actions"><button class="share-link" data-share="download/$slug/">复制分享链接</button><a href="$releaseUrl" target="_blank" rel="noopener">版本详情 ↗</a></div>
  $note
  $checksum
  <div class="card-footer"><span>收录于 $date</span><span>GitHub Releases</span></div>
</article>
