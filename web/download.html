<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载 $name $version · APTX柯南 软件仓库</title>
  <meta name="description" content="$description">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../style.css">
  <script src="../../download.js" defer></script>
</head>
<body class="download-body">
  <main class="download-panel">
    <a class="back-link" href="../../">← 返回软件目录</a>
    <div class="download-symbol" aria-hidden="true">↓</div>
    <div class="eyebrow">YOUR DOWNLOAD</div>
    <h1>$name</h1>
    <p class="download-version">$version <span>·</span> $platform <span>·</span> $size</p>
    <p class="download-status" id="download-status" role="status">正在准备下载…</p>
    <a class="button primary" id="download-link" href="$url">立即下载 <span aria-hidden="true">↗</span></a>
    <p class="download-hint">如果浏览器没有自动开始下载，请点击上方按钮。<br>文件会通过 GitHub Releases 下载，无需登录。</p>
    <details class="checksum"><summary>文件信息与校验值</summary><p>$filename</p><code>$sha256</code></details>
    <noscript><p>浏览器未启用 JavaScript，请点击「立即下载」。</p></noscript>
    <div class="download-footer">APTX柯南 软件仓库 <span>文件分享，简单一点。</span></div>
  </main>
</body>
</html>
